# THE ESTATE, PROVED TOGETHER.
#
# estate.lock.json names the commit of each part that runs with the others.
# This workflow checks the lock's shape, then checks out each part's own
# repository AT THAT COMMIT and runs that part's own fast, offline check.
# No model, no GPU, no Ollama: everything here runs on a stock runner.
#
# Everything is pinned: runner images by name, every action by full commit
# SHA (the tag in the comment), Python, Node and Go by exact version (Go is
# read from each module's go.mod). There is no update bot; a pin moves only
# by a reviewed change to this file.
#
# Job names are stable: lock, tool, manjuel, steward, jesster, aurora.

name: estate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: estate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      manjuel: ${{ steps.commits.outputs.manjuel }}
      steward: ${{ steps.commits.outputs.steward }}
      jesster: ${{ steps.commits.outputs.jesster }}
      aurora: ${{ steps.commits.outputs.aurora }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: The lock's shape (every commit a 40-hex sha)
        run: python tools/estate_lock.py validate
      - name: The locked commits
        id: commits
        run: python tools/estate_lock.py validate --commits | tee -a "$GITHUB_OUTPUT"

  tool:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: The tool's tests
        run: python -m unittest discover -s tests -v

  manjuel:
    needs: lock
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: thebrotherscarr-bit/Manjuel
          ref: ${{ needs.lock.outputs.manjuel }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.18"
      # As Manjuel's own prove.yml installs: the package and its test extra.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: The strokes
        run: python tests/test_manjuel.py

  steward:
    needs: lock
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: thebrotherscarr-bit/Steward
          ref: ${{ needs.lock.outputs.steward }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.10"
      # Steward's own gate.yml, step for step: compile, sample, harness.
      - name: compile
        run: python -m compileall -q .
      - name: sample
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q harness/steward/working/sample-project
      - name: harness
        run: |
          python -m pip install --quiet . pytest
          python -m pytest -q -p no:cacheprovider harness/steward/step04_production_ready/test_harness.py

  jesster:
    needs: lock
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: secondbrain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: thebrotherscarr-bit/Jesster
          ref: ${{ needs.lock.outputs.jesster }}
      - name: Node version (secondbrain/.nvmrc, else 22.23.4)
        id: node
        run: |
          if [ -f .nvmrc ]; then v=$(tr -d '[:space:]' < .nvmrc); else v=22.23.4; fi
          echo "version=$v" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm test

  aurora:
    needs: lock
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: thebrotherscarr-bit/Atlas
          ref: ${{ needs.lock.outputs.aurora }}
      # Both modules' go.mod name the same Go; webapp's is read.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0 (v6 reads go.mod's toolchain line; v5 does not)
        with:
          go-version-file: webapp/go.mod
          cache: false
      - name: go test ./... (webapp)
        working-directory: webapp
        run: go test ./...
      - name: go test ./... (line)
        if: ${{ !cancelled() }}
        working-directory: line
        run: go test ./...

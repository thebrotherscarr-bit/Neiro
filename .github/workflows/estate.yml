# THE ESTATE, PROVED TOGETHER.
#
# estate.lock.json names the commit of each part that runs with the others.
# This workflow checks the lock's shape and that it is current -- each part's
# main, version and Jesster's latest release, read from the GitHub API, must
# match the lock, or the lock job fails -- then checks out each part's own
# repository AT THAT COMMIT and runs that part's own fast, offline check, as
# that part's own CI runs it. No model, no GPU, no Ollama: everything here runs
# on a stock runner.
#
# Everything is pinned: runner images by name, every action by full commit
# SHA (the tag in the comment; all run on Node 24), Python, Node and Go by
# exact version (Python as each part's own CI pins it; Go is read from each
# module's go.mod), pip exactly, and every Python package by hash from the
# part's own lock at the locked commit. There is no update bot; a pin moves
# only by a reviewed change to this file.
#
# Job names are stable: lock, tool, manjuel, steward, jesster, aurora.

name: estate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: estate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      manjuel: ${{ steps.commits.outputs.manjuel }}
      steward: ${{ steps.commits.outputs.steward }}
      jesster: ${{ steps.commits.outputs.jesster }}
      aurora: ${{ steps.commits.outputs.aurora }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: The lock's shape (every commit a 40-hex sha)
        run: python tools/estate_lock.py validate
      - name: The locked commits
        id: commits
        run: python tools/estate_lock.py validate --commits | tee -a "$GITHUB_OUTPUT"
      # THE LOCK IS CURRENT. Each part's main commit and version, Jesster's
      # latest release and build, and the models the parts declare, read from
      # the GitHub API (GET only) and compared with the lock. Any drift fails
      # this job: regenerate the lock (tools/estate_lock.py generate) and send it.
      - name: No drift from each part's main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/estate_lock.py check --remote --strict

  tool:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: The tool's tests
        run: python -m unittest discover -s tests -v

  manjuel:
    needs: lock
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thebrotherscarr-bit/Manjuel
          ref: ${{ needs.lock.outputs.manjuel }}
      # Python and the install as Manjuel's own prove.yml runs its ubuntu 3.13
      # leg: pip exactly, the hashed lock, then manjuel with nothing fetched.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"
      - name: Install (pip, the locked set by hash, then manjuel with nothing fetched)
        run: >-
          python -m pip install pip==26.3 &&
          python -m pip install --require-hashes -r requirements-py313.lock &&
          python -m pip install --no-deps --no-build-isolation ".[test]" &&
          python -m pip check
      - name: The strokes
        run: python tests/test_manjuel.py

  steward:
    needs: lock
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thebrotherscarr-bit/Steward
          ref: ${{ needs.lock.outputs.steward }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
      # Steward's own gate.yml, step for step: compile, install (pip exactly,
      # requirements.lock by hash with no deps, then Steward with nothing
      # fetched), sample, harness.
      - name: compile
        run: python -m compileall -q .
      - name: install
        run: |
          python -m pip install --quiet pip==26.3
          python -m pip install --quiet --require-hashes --no-deps -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation .
      - name: sample
        run: python -m pytest -q harness/steward/working/sample-project
      - name: harness
        run: python -m pytest -q -p no:cacheprovider harness/steward/step04_production_ready/test_harness.py

  jesster:
    needs: lock
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: secondbrain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thebrotherscarr-bit/Jesster
          ref: ${{ needs.lock.outputs.jesster }}
      - name: Node version (secondbrain/.nvmrc, else 22.23.4)
        id: node
        run: |
          if [ -f .nvmrc ]; then v=$(tr -d '[:space:]' < .nvmrc); else v=22.23.4; fi
          echo "version=$v" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm test

  aurora:
    needs: lock
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thebrotherscarr-bit/Atlas
          ref: ${{ needs.lock.outputs.aurora }}
      # Both modules' go.mod name the same Go; webapp's is read.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v6 and later read go.mod's toolchain line; v5 does not)
        with:
          go-version-file: webapp/go.mod
          cache: false
      - name: go test ./... (webapp)
        working-directory: webapp
        run: go test ./...
      - name: go test ./... (line)
        if: ${{ !cancelled() }}
        working-directory: line
        run: go test ./...
